<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Step 04 - 컴포넌트 분화 [완성본 정답]</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 2rem; max-width: 600px; margin: 0 auto; }
    [data-component] { margin-bottom: 1.5rem; }
    .item-input-form { display: flex; gap: 0.5rem; }
    .item-input { flex: 1; padding: 0.5rem; font-size: 1rem; }
    .item-list { list-style: none; padding: 0; }
    .item-list li { display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px dashed #eee; }
    .filter-buttons { display: flex; gap: 0.5rem; }
    .filter-buttons button.active { background: #3b82f6; color: white; border-color: #3b82f6; }
    button { padding: 0.4rem 0.8rem; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module">
    import App from './src/App.js';
    new App(document.querySelector('#app'));
  </script>
</body>
</html>
