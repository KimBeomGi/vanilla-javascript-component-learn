<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Step 00 Level 4 - 모듈과 Class [완성본]</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; max-width: 500px; margin: 0 auto; }
    .box { border: 1px solid #22c55e; padding: 1rem; border-radius: 8px; background: #f0fdf4; }
  </style>
</head>
<body>
  <h1>✨ Level 4: type="module" & class 맛보기 [완성본]</h1>

  <div id="app"></div>

  <script type="module">
    class Greeting {
      constructor($target, name) {
        this.$target = $target;
        this.name = name;
        this.render();
      }

      render() {
        this.$target.innerHTML = `
          <div class="box">
            <h2>안녕하세요, ${this.name}님!</h2>
            <p>축하합니다! 이제 컴포넌트를 배울 모든 기초 준비가 완료되었습니다! 🎉</p>
          </div>
        `;
      }
    }

    new Greeting(document.querySelector('#app'), '초보 개발자');
  </script>
</body>
</html>
