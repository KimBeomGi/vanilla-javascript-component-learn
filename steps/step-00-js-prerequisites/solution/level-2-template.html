<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Step 00 Level 2 - 백틱과 템플릿 리터럴 [완성본 정답]</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; max-width: 500px; margin: 0 auto; }
    .card { border: 1px solid #22c55e; padding: 1rem; border-radius: 8px; background: #f0fdf4; }
  </style>
</head>
<body>
  <h1>🎉 Level 2: 백틱 템플릿 완성본 (Solution)</h1>

  <div id="container"></div>

  <script>
    const user = {
      name: '홍길동',
      age: 20,
      job: '초보 개발자'
    };

    const $container = document.querySelector('#container');

    // 백틱(``)과 ${} 를 사용해 HTML 문자열 조립
    const template = `
      <div class="card">
        <h2>이름: ${user.name}</h2>
        <p>나이: ${user.age}세</p>
        <p>직업: ${user.job}</p>
      </div>
    `;

    $container.innerHTML = template;
  </script>
</body>
</html>
