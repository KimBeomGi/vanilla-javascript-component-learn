<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <title>Step 00 - ES6+ 문법 디딤돌 [실습용]</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 2rem;
      max-width: 700px;
      margin: 0 auto;
      line-height: 1.6;
    }

    .box {
      border: 1px solid #3b82f6;
      padding: 1rem;
      border-radius: 8px;
      background: #eff6ff;
      margin-bottom: 1rem;
    }

    code {
      background: #e2e8f0;
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
    }
  </style>
</head>

<body>
  <h1>🐣 Step 00 - 초보자를 위한 ES6+ 핵심 문법 디딤돌</h1>
  <p>브라우저 개발자 도구 콘솔(<code>F12</code> -> <code>Console</code> 탭)을 열고 스크립트 실행 결과를 확인하세요.</p>

  <div class="box">
    <h3>1. 템플릿 리터럴 & map 연산 결과</h3>
    <div id="output-map"></div>
  </div>

  <div class="box">
    <h3>2. 객체 구조분해 & Spread 결과</h3>
    <div id="output-spread"></div>
  </div>

  <script type="module">
    // TODO 1: 아래 items 배열을 map()과 join('')을 활용해 <li>태그 리스트 문자열로 변환해 보세요.
    const items = [
      { id: 1, text: 'HTML/CSS 완료' },
      { id: 2, text: 'JS 기초 완료' },
      { id: 3, text: '컴포넌트 도전!' }
    ];

    // ✏️ 작성하기
    const htmlList = items.map(item => `
      <li>
        [ID:${item.id}] ${item.text}>
      </li>
    `).join('')
    document.querySelector("#output-map").innerHTML = `
      <ul>
      ${htmlList}
      </ul>
    `

    // TODO 2: state 객체를 Spread 연산자(...)를 이용해 count만 1 증가시킨 newState 객체를 생성해 보세요.
    const state = { count: 10, name: '초보 코더' };

    // ✏️ 작성하기 (힌트: const newState = { ...state, count: state.count + 1 };)
    const newState = { ...state, count: state.count + 1 }

    document.querySelector('#output-spread').innerText = `
      이전: ${JSON.stringify(state)} -> 변경 후 : ${JSON.stringify(newState)}
    `
    console.log(`이전 state:`, JSON.stringify(state))
    console.log(`새로운 newState`, JSON.stringify(newState))
  </script>
</body>

</html>
