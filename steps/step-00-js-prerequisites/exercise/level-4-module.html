  <!-- 1번째 미션: 기본 클래스 -->
  <div id="user-profile-app"></div>

  <!-- 2번째 미션: 상태형 클래스 -->
  <div id="counter-app"></div>

  <!-- 3번째 미션: 클래스 상속 (extends) -->
  <div id="badge-card-app"></div>

  <script type="module">
    /*
      💡 ES6 Class 작성 4단계 공식:
      1. class 클래스명 { ... }
      2. constructor(매개변수) { this.필드 = 매개변수; this.render(); }
      3. render() { this.$target.innerHTML = `템플릿`; }
      4. new 클래스명($target, 데이터);
    */

    // TODO 1: $target과 user 객체({ name, job })를 받아 프로필 카드를 그리는 UserProfile 클래스를 작성하세요.
    class UserProfile {
      // ✏️ constructor($target, user) 및 render() 구현하기

    }


    // TODO 2: $target 요소를 받아 숫자 카운트(+1) 기능을 가지는 CounterClass 클래스를 작성하세요.
    class CounterClass {
      // ✏️ constructor($target) 및 render() 구현하기 (#btn-inc 클릭 시 this.count++ 후 this.render() 재호출)

    }


    // --- ⭐️ 3번째 고급 미션: 클래스 상속 (extends) 체험 ---
    // 공통 부모 클래스 (BaseCard)
    class BaseCard {
      constructor($target, title) {
        this.$target = $target;
        this.title = title;
        this.render();
      }

      render() {
        this.$target.innerHTML = `<div class="card"><h3>${this.title}</h3></div>`;
      }
    }

    // TODO 3: BaseCard를 상속(extends)받아 뱃지가 달린 카드를 그리는 BadgeCard 클래스를 완성해 보세요.
    // ✏️ 1. class BadgeCard extends BaseCard { ... } 작성
    // ✏️ 2. render() 메서드를 오버라이딩하여 <div class="badge-box"><h3>🎉 [뱃지] ${this.title}</h3></div> 대입하기

    class BadgeCard extends BaseCard {
      // ✏️ render() 오버라이딩 재정의하기

    }


    // --- 마운트 실행 ---
    const $userApp = document.querySelector('#user-profile-app');
    const $counterApp = document.querySelector('#counter-app');
    const $badgeApp = document.querySelector('#badge-card-app');

  </script>
</body>
</html>
