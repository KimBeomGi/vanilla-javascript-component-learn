<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Step 00 Level 1 - DOM 조작 기초 [실습용]</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; max-width: 500px; margin: 0 auto; }
    .box { border: 2px dashed #3b82f6; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; }
    button { padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer; }
  </style>
</head>
<body>
  <h1>🐣 Level 1: querySelector & 글자 바꾸기</h1>
  <p>버튼을 누르면 자바스크립트가 글자를 바꿉니다.</p>

  <div class="box">
    <h2 id="target-title">원래 글자입니다.</h2>
    <div id="target-content">여기에 내용이 들어갑니다.</div>
  </div>

  <button id="btn-change">글자 바꾸기 버튼</button>

  <script>
    // 1. querySelector로 버튼과 요소들을 가져옵니다.
    const $btn = document.querySelector('#btn-change');
    const $title = document.querySelector('#target-title');
    const $content = document.querySelector('#target-content');

    // 2. 버튼 클릭 이벤트 연결
    $btn.addEventListener('click', () => {
      // TODO 1: $title.innerText 를 "🎉 글자가 성공적으로 바뀌었습니다!" 로 바꿔보세요.
      // ✏️ 여기에 작성: $title.innerText = "...";
      $title.innerText = "글자 변경!"

      // TODO 2: $content.innerHTML 을 "<strong>HTML 태그가 적용된 굵은 글자</strong>" 로 바꿔보세요.
      // ✏️ 여기에 작성: $content.innerHTML = "...";
      $content.innerHTML = `
        <strong>
          REACT는 신이다!
        <strong>
      `;
    });
  </script>
</body>
</html>
