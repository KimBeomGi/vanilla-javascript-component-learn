<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Step 00 Level 3 - 함수 선언식 vs 표현식 vs 화살표 함수 & this의 정체 [실습용]</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; max-width: 650px; margin: 0 auto; line-height: 1.6; }
    .box { border: 1px solid #3b82f6; padding: 1.2rem; border-radius: 8px; background: #eff6ff; margin-bottom: 1rem; }
    button { background: #3b82f6; color: white; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-size: 0.95rem; }
    button:hover { background: #2563eb; }
    code { background: #e2e8f0; padding: 0.2rem 0.4rem; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>🐣 Level 3: 함수 3형제 & this의 정체 마스터하기</h1>

  <div class="box">
    <h3>1. 함수 선언식 vs 표현식 vs 화살표 함수</h3>
    <p>아래 3가지 방법으로 작성한 함수가 어떻게 실행되는지 콘솔(F12)에서 확인해 봅시다.</p>
    <div id="output-func"></div>
  </div>

  <div class="box">
    <h3>2. `function` vs 화살표 함수 `() => {}` 에서의 `this` 차이</h3>
    <button id="btn-fn">1) 일반 function 버튼 클릭</button>
    <button id="btn-arrow">2) 화살표 함수 () => {} 버튼 클릭</button>
    <div id="output-this" style="margin-top: 0.8rem; font-weight: bold;"></div>
  </div>

  <script type="module">
    // 1. 함수 선언식 (Function Declaration)
    function addDeclarative(a, b) {
      return a + b;
    }

    // 2. 함수 표현식 (Function Expression)
    const addExpression = function(a, b) {
      return a + b;
    };

    // 3. 화살표 함수 (Arrow Function) - ES6
    const addArrow = (a, b) => a + b;

    document.querySelector('#output-func').innerHTML = `
      선언식: ${addDeclarative(1, 2)} | 
      표현식: ${addExpression(1, 2)} | 
      화살표: ${addArrow(1, 2)}
    `;

    // --- this 의 3대 법칙 실습 ---
    const $btnFn = document.querySelector('#btn-fn');
    const $btnArrow = document.querySelector('#btn-arrow');
    const $outputThis = document.querySelector('#output-this');

    // TODO: 일반 function() 클릭 시 this가 누군지 콘솔과 화면에 출력해보세요.
    // ✏️ 작성하기:
    $btnFn.addEventListener('click', function(e) {
      // 일반 function 내부의 this는 나를 호출한 버튼 태그 자신입니다!
      console.log('일반 function의 this:', this);
      $outputThis.innerText = `일반 function의 this = [${this.tagName}#${this.id}]`;
    });

    // TODO: 화살표 함수 () => {} 클릭 시 this가 누군지 콘솔과 화면에 출력해보세요.
    // ✏️ 작성하기:
    $btnArrow.addEventListener('click', (e) => {
      // 화살표 함수의 this는 나를 호출한 버튼이 아니라, 태어난 상위 스코프(Window 또는 Module)를 가리킵니다!
      console.log('화살표 함수의 this:', this);
      $outputThis.innerText = `화살표 함수의 this = [${this}] (태어난 상위 스코프 보존!)`;
    });
  </script>
</body>
</html>
