<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Step 01 - Declarative [완성본 정답]</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; }
    .container { border: 1px solid #4A90E2; padding: 1rem; border-radius: 8px; max-width: 400px; }
    button { padding: 0.5rem 1rem; margin-right: 0.5rem; font-size: 1rem; cursor: pointer; }
  </style>
</head>
<body>
  <h1>선언적(Declarative) 완성본 정답 (Solution)</h1>
  <div id="app"></div>

  <script>
    // 💡 정답 해설 1: 상태 객체 선언
    let state = {
      count: 0
    };

    const $app = document.querySelector('#app');

    // 💡 정답 해설 2: 현재 state.count 상태 기반 선언적 렌더링
    function render() {
      $app.innerHTML = `
        <div class="container">
          <h2>카운터: ${state.count}</h2>
          <button id="btn-inc">+</button>
          <button id="btn-dec">-</button>
        </div>
      `;

      setEvents();
    }

    // 💡 정답 해설 3: 상태 불변성 복사 병합 및 자동 재렌더링
    function setState(newState) {
      state = { ...state, ...newState };
      render();
    }

    // 💡 정답 해설 4: 버튼 이벤트에서 setState 호출
    function setEvents() {
      document.querySelector('#btn-inc').addEventListener('click', () => {
        setState({ count: state.count + 1 });
      });

      document.querySelector('#btn-dec').addEventListener('click', () => {
        setState({ count: state.count - 1 });
      });
    }

    // 최초 렌더링 실행
    render();
  </script>
</body>
</html>
