<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Step 01 - Declarative (선언적 상태 기반) 예시</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; }
    .container { border: 1px solid #4A90E2; padding: 1rem; border-radius: 8px; max-width: 400px; }
    button { padding: 0.5rem 1rem; margin-right: 0.5rem; font-size: 1rem; cursor: pointer; }
  </style>
</head>
<body>
  <h1>2️⃣ 선언적(Declarative) 상태 기반 방식</h1>
  <p>상태(state)를 정의하고, 상태가 바뀌면 render()가 호출되어 화면을 자동으로 갱신합니다.</p>

  <div id="app"></div>

  <script>
    // 1. 애플리케이션 상태
    let state = {
      count: 0
    };

    const $app = document.querySelector('#app');

    // 2. 렌더링 함수: state를 기반으로 템플릿 반환 (UI = f(state))
    function render() {
      $app.innerHTML = `
        <div class="container">
          <h2>카운터: ${state.count}</h2>
          <button id="btn-inc">+</button>
          <button id="btn-dec">-</button>
        </div>
      `;

      // 렌더링 후 이벤트 재연결 (단순 상태 기반의 한계점 맛보기)
      setEvents();
    }

    // 3. 상태 변경 전용 함수 (setState)
    function setState(newState) {
      state = { ...state, ...newState };
      render(); // 상태 변경 시 자동으로 화면 재렌더링!
    }

    // 4. 이벤트 연결
    function setEvents() {
      document.querySelector('#btn-inc').addEventListener('click', () => {
        setState({ count: state.count + 1 });
      });

      document.querySelector('#btn-dec').addEventListener('click', () => {
        setState({ count: state.count - 1 });
      });
    }

    // 초기 렌더링 실행
    render();
  </script>
</body>
</html>
